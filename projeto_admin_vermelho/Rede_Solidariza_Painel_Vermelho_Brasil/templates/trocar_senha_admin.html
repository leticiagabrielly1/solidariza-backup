{% extends 'base.html' %}{% block content %}<div class="auth-shell"><section class="auth-form" style="max-width:580px;margin:auto"><h1>Trocar senha administrativa</h1><p>Por segurança, o CEP só pode ser usado como senha inicial. Crie uma senha exclusiva para esta unidade.</p><form method="post">{{ csrf() }}<label>Senha atual<input type="password" name="atual" required></label><label>Nova senha (mínimo 12 caracteres)<input type="password" name="nova" minlength="12" required></label><button class="button yellow full">Salvar nova senha</button></form></section></div>{% endblock %}
