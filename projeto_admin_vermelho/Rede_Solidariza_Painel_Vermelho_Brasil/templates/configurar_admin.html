{% extends 'base.html' %}{% block content %}<div class="auth-shell"><section class="auth-form" style="max-width:580px;margin:auto"><h1>Primeiro administrador</h1><p>Disponível apenas no computador local, antes da criação do primeiro administrador. Cadastre primeiro uma conta comum.</p><form method="post">{{ csrf() }}<label>CPF da conta já cadastrada<input name="cpf" pattern="[0-9]{11}" maxlength="11" required></label><label>Unidade Senac<select name="ponto" required>{% for u in unidades %}<option value="{{ u.nome }}">{{ u.nome }}</option>{% endfor %}</select></label><label>CEP real da unidade<input name="cep" pattern="[0-9]{8}" maxlength="8" required></label><button class="button yellow full">Criar administrador</button></form></section></div><p style="margin-top:20px"><a href="{{ url_for('login_admin') }}">← Voltar ao login administrativo</a></p>{% endblock %}
