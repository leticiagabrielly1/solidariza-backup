{% extends 'base.html' %}{% block content %}<div class="admin-login-container"><section class="admin-login-card"><h1>Rede Solidariza</h1><h2>Login do administrador</h2><p>Use o CEP da unidade Senac e a senha administrativa.</p><form method="post">{{ csrf() }}<label>CEP do Senac<input name="cep" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required placeholder="8 números" autocomplete="username"></label><label>Senha<input type="password" name="senha" required autocomplete="current-password"></label><button type="submit">Entrar no painel</button></form><p><a href="{{ url_for('login') }}">Voltar ao login comum</a></p></section></div>{% endblock %}
